<!-- @dsCard group="Actions" height=120 subtitle="Primary, secondary, ghost, danger, small, icon" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="tw-stage">
  <button class="tw-btn tw-btn-primary">Send to both panes</button>
  <button class="tw-btn">Clone into split</button>
  <button class="tw-btn tw-btn-ghost">Cancel</button>
  <button class="tw-btn tw-btn-danger">Delete conversation</button>
</div>
<div class="tw-stage" style="padding-top:0">
  <button class="tw-btn tw-btn-sm"><svg class="tw-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <button class="tw-btn tw-btn-ghost tw-btn-icon" aria-label="Copy"><svg class="tw-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
  <button class="tw-btn tw-btn-ghost tw-btn-icon" aria-label="Regenerate"><svg class="tw-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
  <button class="tw-btn tw-btn-ghost tw-btn-icon" aria-label="Open in split"><svg class="tw-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
  <button class="tw-btn tw-btn-sm" disabled>Disabled</button>
</div>
</body>
</html>
