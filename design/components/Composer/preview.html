<!-- @dsCard group="Chat" height=200 subtitle="Prompt input with attachments, model, tools and send" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Composer</title></head>
<body>
<div class="tw-stack">
  <div class="tw-composer">
    <div class="tw-attach">
      <span class="tw-badge"><svg class="tw-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>outline.md</span>
      <span class="tw-badge"><svg class="tw-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>characters/wren.md</span>
    </div>
    <textarea rows="2" placeholder="Ask anything, or type / for writing tools"></textarea>
    <div class="tw-composer-bar">
      <button class="tw-btn tw-btn-ghost tw-btn-icon" aria-label="Attach"><svg class="tw-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tw-btn tw-btn-ghost tw-btn-sm tw-toggle" aria-pressed="true"><svg class="tw-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/></svg>Tools · 6</button>
      <span class="tw-spacer"></span>
      <button class="tw-chip"><span class="tw-dot" style="color:var(--success)"></span>Opus 5.5</button>
      <button class="tw-send" aria-label="Send"><svg class="tw-icon" viewBox="0 0 24 24" style="stroke-width:2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
