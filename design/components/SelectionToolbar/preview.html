<!-- @dsCard group="Writing" height=200 subtitle="Floats above a text selection in the editor" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SelectionToolbar</title></head>
<body>
<div class="tw-page">
  <div class="tw-seltool" role="toolbar" aria-label="Writing tools">
    <button class="tw-btn tw-btn-ghost tw-btn-sm tw-ask"><svg class="tw-icon" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ask</button>
    <span class="tw-sep"></span>
    <button class="tw-btn tw-btn-ghost tw-btn-sm">Rewrite</button>
    <button class="tw-btn tw-btn-ghost tw-btn-sm">Tighten</button>
    <button class="tw-btn tw-btn-ghost tw-btn-sm">Expand</button>
    <button class="tw-btn tw-btn-ghost tw-btn-sm">Tone<svg class="tw-icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="tw-sep"></span>
    <button class="tw-btn tw-btn-ghost tw-btn-icon" aria-label="Compare in split"><svg class="tw-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
  </div>
  <p class="tw-prose" style="margin-top:var(--space-2)">The lamps came on one street at a time, <span class="tw-sel">as if the town were remembering itself.</span> Wren stopped on the bridge to count them.</p>
</div>
</body>
</html>
