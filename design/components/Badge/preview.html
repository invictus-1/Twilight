<!-- @dsCard group="Status" height=104 subtitle="Badge, status dot, keyboard key" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge</title></head>
<body>
<div class="tw-stage">
  <span class="tw-badge">Draft</span>
  <span class="tw-badge tw-badge-iris">Pinned</span>
  <span class="tw-badge tw-badge-dusk">MCP · 6 tools</span>
  <span class="tw-badge tw-badge-horizon">Writing</span>
  <span class="tw-badge tw-badge-danger">Failed</span>
</div>
<div class="tw-stage" style="padding-top:0">
  <span class="tw-badge"><span class="tw-dot" style="color:var(--success)"></span>Online</span>
  <span class="tw-badge"><span class="tw-dot" style="color:var(--warning)"></span>Rate limited</span>
  <span class="tw-badge"><span class="tw-dot" style="color:var(--danger)"></span>Offline</span>
  <span style="color:var(--ink-muted);font-size:12px;display:inline-flex;gap:4px;align-items:center"><span class="tw-kbd">Ctrl</span><span class="tw-kbd">\</span> split</span>
</div>
</body>
</html>
